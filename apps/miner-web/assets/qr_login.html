<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="pelish-logo.png">
    <title>Avalon Device</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            color: #333;
        }

        .login-container {
            background-color: white;
            width: 460px;
            max-width: 100%;
            padding: 40px 50px;
            border-radius: 30px;
            text-align: center;
        }

        .login-container .login-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 24px auto 36px;
            flex-wrap: wrap;
        }

        .login-logo .brand-logo-pelish {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.14));
            flex-shrink: 0;
        }

        .login-logo .brand-logo-divider {
            width: 1px;
            height: 52px;
            background-color: #dcdfe8;
            flex-shrink: 0;
        }

        .login-logo .brand-logo-canaan {
            height: 42px;
            width: auto;
            max-width: 165px;
            object-fit: contain;
            flex-shrink: 0;
        }

        @media (max-width: 420px) {
            .login-container {
                padding: 32px 24px;
            }

            .login-logo .brand-logo-pelish {
                width: 76px;
                height: 76px;
            }

            .login-logo .brand-logo-divider {
                height: 40px;
            }

            .login-logo .brand-logo-canaan {
                height: 34px;
            }
        }

        .qrcode-wrapper {
            width: 100%;
            text-align: center;
        }

        .qrcode-wrapper #qrcode {
            width: 140px;
            height: 140px;
            margin: 0 auto 40px;
            background-color: #f3f4f8;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qrcode-wrapper .qrcode-tip {
            color: #060000;
        }

        .login-container .or-text {
            margin: 50px 0 36px;
            color: #060000;
        }

        .login-container a {
            color: #418cff;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        .copyright {
            margin-top: 20px;
            font-size: 12px;
            color: #060000;
        }
    </style>
    <script src="./qrcode.min.js"></script>
</head>

<body>
    <div class="login-container">
        <div class="login-logo">
            <img class="brand-logo-pelish" src="pelish-logo.png" alt="Pelish Crypto &amp; More">
            <span class="brand-logo-divider" aria-hidden="true"></span>
            <img class="brand-logo-canaan" src="canaan-logo.png" alt="Canaan">
        </div>
        <div class="qrcode-wrapper">
            <div id="qrcode"></div>
            <div class="qrcode-tip">Scan the QR Code with Your <a href="https://www.canaan.io/avalonfamily" target="_blank" style="color: #060000; text-decoration: underline;">Avalon Family APP</a></div>
        </div>
        <form name="loginform" action="/" method="get" style="display: none;"></form>
    </div>
    <div class="copyright">Copyright © Canaan Creative Co., Ltd.</div>
</body>

<script>
    function AJAX(url, callback) {
        var req = AJAX_init();
        req.onreadystatechange = AJAX_processRequest;
        function AJAX_init() {
            if (window.XMLHttpRequest) {
                return new XMLHttpRequest();
            } else {
                if (window.ActiveXObject) {
                    return new ActiveXObject("Microsoft.XMLHTTP");
                }
            }
        }
        function AJAX_processRequest() {
            if (req.readyState == 4) {
                if (req.status == 200) {
                    if (callback) {
                        callback(req.responseText);
                    }
                }
            }
        }
        this.doGet = function () {
            req.open("GET", url, true);
            req.send(null);
        };
        this.doPost = function (body) {
            req.open("POST", url, true);
            req.setRequestHeader(
                "Content-Type",
                "application/x-www-form-urlencoded"
            );
            req.setRequestHeader("ISAJAX", "yes");
            req.send(body);
        };
    }

    // A cookie set over HTTPS stays off plain HTTP.
    function secureAttr() {
        return location.protocol === "https:" ? "; Secure" : "";
    }

    function clearCookie(name) {
        document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/" + secureAttr() + ";";
    }

    let getAuthTimer = null;
    let qrSession = "";
    function getAuthCallback(req) {
        if (req && req.auth && req.session) {
            if (getAuthTimer) {
                clearInterval(getAuthTimer);
            }
            try {
                qrSession = req.session || "";
                let plaintext = JSON.stringify({auth: req.auth, code: req.code});
                renderQrcode(plaintext);
            } catch (e) {
                console.log("err:" + e.message)
            }
        }
    }

    function getCookieCallback(req) {
        if (req && req.auth) {
            location.href = "dashboard.html";
        }
    }

    function getAuth() {
        let oUpdate;
        oUpdate = new AJAX("/api/v1/auth?num=" + Math.random(),
            function (t) {
                try {
                    getAuthCallback(JSON.parse(t))
                } catch (e) {
                    console.log("get auth err:" + e.message)
                }
            });
        oUpdate.doGet();
    }

    function renderQrcode(plaintext) {
        let qrcode = new QRCode(document.getElementById("qrcode"), {
            text: plaintext,
            width: 120,
            height: 120,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function checkLogin() {
        if (!qrSession) return;
        let oUpdate;
        oUpdate = new AJAX("/api/v1/qr-login?num=" + Math.random(),
            function (t) {
                try {
                    getCookieCallback(JSON.parse(t))
                } catch (e) {
                    console.log("check login err:" + e.message)
                }
            });
        oUpdate.doPost("session=" + encodeURIComponent(qrSession));
    }

    function passwdLogin() {
        loginform.submit();
    }

    setTimeout(() => {
        getAuth()
        getAuthTimer = setInterval(function () { getAuth() }, 5000);
    }, 800);

    setInterval(function () { checkLogin() }, 5000);
    clearCookie("auth");
    setTimeout(() => location.reload(), 290000);
</script>

</html>
