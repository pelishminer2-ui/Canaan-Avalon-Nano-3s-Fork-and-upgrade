<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="pelish-logo.png">
    <title>Change Password</title>
    <script>
        (function () {
            var theme = "";
            try {
                var s = localStorage.getItem("pelish-theme");
                if (s === "light" || s === "dark") theme = s;
            } catch (e) {}
            if (!theme) {
                try {
                    var m = String(document.cookie || "").match(/(?:^|; )pelish-theme=(light|dark)/);
                    if (m) theme = m[1];
                } catch (e2) {}
            }
            if (theme !== "dark") theme = "light";
            try {
                var root = document.documentElement;
                if (root && root.setAttribute) root.setAttribute("data-theme", theme);
            } catch (e3) {}
        })();
    </script>
    <link rel="stylesheet" href="chrome.css">
    <style>
        .brand-logo-pelish, .brand-logo-canaan { background-color: transparent; }
        @media (prefers-color-scheme: dark) {
            .brand-logo-pelish, .brand-logo-canaan { background-color: transparent; }
        }
    </style>
    <script src="chrome.js"></script>
</head>

<body class="shell">
    <nav class="sidenav">
        <a class="nav-brand" href="dashboard.html">
            <img class="brand-logo-pelish" src="pelish-logo.png" alt="Pelish Crypto &amp; More">
            <img class="brand-logo-canaan" src="canaan-logo.png" alt="Canaan">
        </a>
        <a class="nav-link" href="dashboard.html">Overview</a>
        <a class="nav-link" href="pools.html">Configuration</a>
        <a class="nav-link" href="network.html">Network</a>
        <a class="nav-link" href="log.html">Log</a>
        <div class="nav-label">System</div>
        <a class="nav-link nav-sub active" href="password.html">Password</a>
        <a class="nav-link nav-sub" href="upgrade.html">Upgrade</a>
        <button type="button" class="nav-btn nav-sub" onclick="navReboot()">Reboot</button>
        <a class="nav-link nav-sub" href="reset.html">ResetFac</a>
        <div class="nav-bottom">
            <span class="nav-link disabled" title="Factory cloud shop. Not served by this LAN miner.">Shop</span>
            <span class="nav-link disabled" title="System log download needs an API token. Miner Log is the LAN page.">System log</span>
            <span class="nav-link disabled" title="Factory cloud support. Not served by this LAN miner.">Support</span>
            <span class="nav-link disabled" title="Factory cloud documents. Not served by this LAN miner.">Documents</span>
        </div>
    </nav>
    <div class="shell-main">
        <header class="topbar">
            <div class="topbar-left">
                <div class="header-logo">
                    <img class="brand-logo-pelish" src="pelish-logo.png" alt="Pelish Crypto &amp; More">
                    <img class="brand-logo-canaan" src="canaan-logo.png" alt="Canaan">
                </div>
                <div class="header-name">Avalon Device</div>
                <div class="header-separator"></div>
                <div class="status-pill">
                    <span class="header-status"></span>
                    <span class="header-status-text">—</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="theme-choice" role="group" aria-label="Color theme">
                    <button type="button" id="theme-light" onclick="applyTheme('light')">Light</button>
                    <button type="button" id="theme-dark" onclick="applyTheme('dark')">Dark</button>
                </div>
                <button type="button" class="header-load-icon" onclick="updateDashboard()">Reload</button>
                <div class="header-load-text">latest reloaded</div>
                <div class="header-load-time">—</div>
                <button type="button" class="header-logout" onclick="logout()">Logout</button>
            </div>
        </header>
        <div class="page-body">
            <div class="panel">
                <div class="section-bar">Change Password</div>
                <form class="pw-form" onsubmit="return savePassword(event)">
                    <div class="pw-row">
                        <label for="pw-current">Current password</label>
                        <input id="pw-current" type="password" maxlength="64" autocomplete="current-password" placeholder="Current password">
                        <span></span>
                    </div>
                    <div class="pw-row">
                        <label for="pw-new">New Password</label>
                        <input id="pw-new" type="password" maxlength="64" autocomplete="new-password" placeholder="New Password">
                        <span></span>
                    </div>
                    <div class="pw-row">
                        <label for="pw-confirm">Confirm</label>
                        <input id="pw-confirm" type="password" maxlength="64" autocomplete="new-password" placeholder="Confirm">
                        <span></span>
                    </div>
                    <p class="field-note">The miner API needs the current password and the new one. A comma cannot be used.</p>
                    <div class="form-actions"><button type="submit" class="btn-blue">Save</button></div>
                </form>
            </div>
        </div>
        <footer class="miner-footer">
            <div><span class="foot-label">Mac Address</span> <span class="macaddress">—</span></div>
            <div><span class="foot-label">SSID</span> <span class="ssid">—</span></div>
            <div><span class="foot-label">IP Address</span> <span class="ipaddress" title="The miner API does not report an IP address">—</span></div>
            <div><span class="foot-label">Firmware Version</span> <span class="version">—</span></div>
        </footer>
        <div class="mask"></div>
        <div class="loading">
            <svg class="spinner" viewBox="0 0 50 50" width="64" height="64">
                <circle cx="25" cy="25" r="20" fill="none" stroke="#262626" stroke-width="5" stroke-dasharray="90 150"/>
            </svg>
            <div class="status-text">Restarting</div>
        </div>
    </div>
</body>
<script>
    function updateDashboard() {
        stampLoadTime();
        shellHeaderFetch();
    }
    function savePassword(event) {
        event.preventDefault();
        var cur = document.getElementById("pw-current").value;
        var next = document.getElementById("pw-new").value;
        var again = document.getElementById("pw-confirm").value;
        if (!cur || !next) { alert("Enter the current password and a new password"); return false; }
        if (next !== again) { alert("New password and confirmation do not match"); return false; }
        if (cur.length > 64 || next.length > 64) { alert("Password too long"); return false; }
        if (cur.indexOf(",") >= 0 || next.indexOf(",") >= 0) {
            alert("Password cannot contain a comma");
            return false;
        }
        fetch("/api/v1/password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: "password", parameter: cur + "," + next })
        }).then(function (r) {
            return r.text().then(function (t) {
                var msg = "";
                try {
                    var j = JSON.parse(t);
                    var st = j && j.STATUS && j.STATUS[0];
                    msg = st && st.Msg ? st.Msg : (j && j.reason ? j.reason : "");
                } catch (e) {}
                if (!r.ok || (msg && /fail|invalid|error/i.test(msg) && r.status >= 400))
                    throw new Error(msg || "Password was not changed");
                document.getElementById("pw-current").value = "";
                document.getElementById("pw-new").value = "";
                document.getElementById("pw-confirm").value = "";
                alert(msg || "Password saved. Sign in again with the new password.");
            });
        }).catch(function (e) {
            alert(e.message || "Password was not changed");
        });
        return false;
    }
    updateDashboard();
</script>
</html>
